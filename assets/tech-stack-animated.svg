<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 471" width="920" height="471">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121e" />
      <stop offset="100%" stop-color="#0e1726" />
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace; }
      .title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 600; fill: #f0f6fc; }
      
      @keyframes gentleFloat1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3.5px); }
      }
      @keyframes gentleFloat2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes gentleFloat3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes borderScan {
        0% { stroke: #30363d; }
        50% { stroke: #58a6ff; }
        100% { stroke: #30363d; }
      }

      .card-frame {
        animation: borderScan 8s ease-in-out infinite;
      }
      .float-group-0 { animation: gentleFloat1 4.2s ease-in-out infinite; }
      .float-group-1 { animation: gentleFloat2 3.8s ease-in-out infinite 0.6s; }
      .float-group-2 { animation: gentleFloat3 4.5s ease-in-out infinite 1.2s; }
      .float-group-3 { animation: gentleFloat1 3.9s ease-in-out infinite 1.8s; }
      .float-group-4 { animation: gentleFloat2 4.3s ease-in-out infinite 2.4s; }

      .badge-box {
        transition: transform 0.2s, filter 0.2s;
      }
    </style>
  </defs>

  <!-- Background Frame -->
  <rect width="920" height="471" rx="12" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.5" class="card-frame" />
  
  <!-- Header Bar -->
